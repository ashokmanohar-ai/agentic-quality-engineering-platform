services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      MODEL_PROVIDER: mock
      DATABASE_URL: sqlite:////data/aqe.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      OTEL_ENABLED: "false"
    volumes:
      - aqe-data:/data
      - generated-tests:/app/automation/playwright/generated
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    ports:
      - "6006:6006"

volumes:
  aqe-data:
  generated-tests:
