name: Nightly Quality

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/playwright/package-lock.json
      - run: pip install -e '.[dev]'
      - run: pytest
        env:
          MODEL_PROVIDER: mock
      - run: python scripts/run_evaluations.py --provider mock
      - run: npm ci
        working-directory: automation/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: automation/playwright
      - run: npm test
        working-directory: automation/playwright
        env:
          CI: "true"

